[workspace]
resolver = "2"
members = [
    "crates/tpt-telos-parser",
    "crates/tpt-telos-ir",
    "crates/tpt-telos-verifier",
    "crates/tpt-telos-router",
    "crates/tpt-telos-agent",
    "crates/tpt-telos-codegen",
    "crates/tpt-telos-lsp",
    "crates/tpt-telos-cli",
    "crates/out-telos-wasm",
    "crates/tpt-telos-sdk",
    "crates/tpt-telos-prove",
    # tpt-telos-uir-bridge is intentionally NOT a workspace member here. Its `uir`
    # feature is off by default and the crate compiles to a stub without it, but
    # that doesn't help at the *workspace* level: Cargo loads every `members`
    # manifest (including optional path deps' Cargo.toml files) to build the
    # shared lockfile, regardless of `default-members` or which features are
    # enabled -- confirmed by testing here, `default-members` cannot route
    # around this. Its `tpt-uir-core`/`tpt-uir-dialects`/`tpt-uir-serde` path
    # deps point at a sibling `../../tpt-uir` checkout that isn't present on
    # every machine, so plain `cargo check`/`cargo check --workspace` fail
    # outright with it listed here unless that sibling repo exists. Build it
    # directly instead when `tpt-uir` is checked out:
    # `cargo check --manifest-path crates/tpt-telos-uir-bridge/Cargo.toml`.
    # "crates/tpt-telos-uir-bridge",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-telos"
homepage = "https://github.com/tpt-solutions/tpt-telos"
documentation = "https://docs.rs/tpt-telos"
keywords = ["verification", "compiler", "transpiler", "smt", "formal-methods"]
categories = ["compilers", "development-tools", "command-line-utilities"]

[workspace.dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
